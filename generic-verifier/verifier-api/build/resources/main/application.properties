spring.application.name=avance-verifier
server.port=8080
# detras de haproxy: respeta X-Forwarded-*
server.forward-headers-strategy=framework
spring.webflux.static-path-pattern=/public/**
spring.webflux.webjars-path-pattern=/webjars/**
spring.web.error.include-stacktrace=never
logging.level.org.springframework=info

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

#
# Verifier
#
# "auto": con x509_hash se deriva de la huella SHA-256 del carnet
verifier.originalClientId=auto
# x509_hash: el wallet identifica al verifier por la huella de su carnet (WRPAC), sin depender del nombre de host
verifier.clientIdPrefix=x509_hash
# URL publica (con prefijo /verifier cuando va detras del haproxy del dominio compartido)
verifier.publicUrl=${VERIFIER_PUBLICURL:http://localhost:8480}
verifier.requestJwt.embed=ByReference
verifier.requestJwt.requestUriMethod=Get
verifier.defaultHttpResponseMode=DirectPostJwt
# la solicitud vive 10 minutos
verifier.maxAge=PT10M
# la presentacion (con datos personales) se borra a los 30 minutos
verifier.presentations.cleanup.maxAge=PT30M
verifier.authorizationRequestUri=openid4vp://
verifier.allowedRedirectUriSchemes=https

# Carnet del verifier (WRPAC): keystore PKCS12 generado por docker-compose/scripts/generar-pki-verifier.sh
verifier.access-certificate.keystore=${VERIFIER_KEYSTORE:file:./docker-compose/secretos/pki/verifier-keystore.p12}
verifier.access-certificate.keystore.type=PKCS12
# la contrasena SOLO por entorno: VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD y VERIFIER_ACCESS_CERTIFICATE_PASSWORD
verifier.access-certificate.alias=access_certificate
verifier.access-certificate.signing-algorithm=ES256

# Esta instancia solo verifica la credencial academica (SD-JWT VC); sin mdoc
verifier.clientMetadata.vpFormats.sdJwtVc.enabled=true
verifier.clientMetadata.vpFormats.sdJwtVc.sdJwtAlgorithms=ES256
verifier.clientMetadata.vpFormats.sdJwtVc.kbJwtAlgorithms=ES256
verifier.clientMetadata.vpFormats.msoMdoc.enabled=false

# Clasificacion: la credencial academica de la UIS es PubEAA (su raiz figura en la lista PUBEAA del tl-publisher)
verifier.attestation-classifications={"pid":{"vcts":["urn:eudi:pid:1"],"docTypes":["eu.europa.ec.eudi.pid.1"]},"qeaa":{"vcts":[],"docTypes":[]},"pubeaa":{"vcts":["urn:eudi:academic:credential:1"],"docTypes":[]},"eaa":[]}

# Confianza en emisores: listas del tl-publisher. Si falla la descarga o la firma, NO hay confianza (falla cerrado).
verifier.trust.lists.pid=${VERIFIER_TL_PID:https://civica.avance.org.co/tl-publisher/TL/PID/current.json}
verifier.trust.lists.pub-eaa=${VERIFIER_TL_PUBEAA:https://civica.avance.org.co/tl-publisher/TL/PUBEAA/current.json}
# huella SHA-256 de "Civica Trusted List Signing CA", que firma las listas (pin del firmante)
verifier.trust.signer-pins-sha256=${VERIFIER_TL_SIGNER_PINS:5434f122157c56a9ba09caef1877f62d4f65065e1c560c46533e185338814beb}
verifier.trust.cache-ttl=PT15M

# Certificado de registro (WRPRC) generado por docker-compose/scripts/generar-wrprc.py
verifier.intendedUses[0].id=academic
verifier.intendedUses[0].description=Verificar un titulo academico
verifier.intendedUses[0].registration-certificate-file=${VERIFIER_WRPRC_FILE:./docker-compose/pki/wrprc.jwt}

#
# Validaciones
#
verifier.validation.statusCheck.enabled=true
verifier.validation.sdJwtVc.kbJwt.clock.skew=PT5S
verifier.validation.sdJwtVc.typeMetadata.policy=not-used

# Resolucion de type metadata (no se usa con policy=not-used, pero el binder necesita el bloque)
verifier.validation.sdJwtVc.typeMetadata.resolution.cache.ttl=PT1H
verifier.validation.sdJwtVc.typeMetadata.resolution.cache.maxEntries=10
verifier.validation.sdJwtVc.typeMetadata.resolution.integrity.enabled=false
verifier.validation.sdJwtVc.typeMetadata.resolution.integrity.allowedAlgorithms=sha256,sha384,sha512

verifier.transactionData.hashAlgorithm=sha-256

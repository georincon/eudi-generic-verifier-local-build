# FRAGMENTO PARA haproxy-uis. NO esta aplicado: lo aplica quien administra ese haproxy.
# (docker-compose/haproxy/haproxy.conf del proyecto eudi-generic-issuer-local-build)
#
# 1) En el "frontend all", junto a los demas use_backend (antes de cualquier regla mas general):
    use_backend verifier-backend if { path_beg /verifier }

# 2) Un backend nuevo. La app sirve en la raiz, asi que el proxy quita el prefijo /verifier;
#    VERIFIER_PUBLICURL debe ser https://<dominio>/verifier para que los request_uri lo incluyan.
backend verifier-backend
    http-request set-path %[path,regsub(^/verifier,)]
    server avance-verifier avance-verifier-api:8080 check

# Requisito: el contenedor avance-verifier-api debe estar en la red del haproxy (docker-compose.haproxy.yaml).
# Comprobacion despues de recargar:  curl -s -o /dev/null -w '%{http_code}\n' https://<dominio>/verifier/actuator/health
